spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${email}
    password: ${pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  application:
    name: sistemabancario

  datasource:
    url: jdbc:mysql://localhost:3307/sistema_bancario?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: VARCHAR
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  sql:
    init:
      mode: always